name: Feature proposal
description: Propose a concrete improvement to the local ledger or report.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or measurement is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This should remain local-first and avoid telemetry.
        - label: This should not invent model pricing.
